<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agri-Share | Sharing Resources, Growing Together</title>
    <meta name="description" content="Agri-Share: peer-to-peer agricultural machinery rental and crop marketplace connecting farmers, machinery owners and bulk buyers across Pakistan. Tractors, threshers and harvesters near you." />
    <meta name="theme-color" content="#145A32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Latin fonts load without blocking first paint (print media, switched to all once downloaded) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" /></noscript>
    <!-- Urdu / Punjabi / Sindhi / Pashto / Balochi fonts (Nastaliq + Naskh) only load for right-to-left languages.
         If the visitor chose one earlier, start the download right away; otherwise the app adds it on switch. -->
    <script>
      (function () {
        try {
          var lang = JSON.parse(localStorage.getItem("agrishare.lang") || '"en"');
          if (["ur", "pa", "sd", "ps", "bal"].indexOf(lang) === -1) return;
          var l = document.createElement("link");
          l.rel = "stylesheet"; l.id = "rtl-fonts"; l.media = "print";
          l.href = "https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap";
          l.onload = function () { this.media = "all"; };
          document.head.appendChild(l);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Agri-Share needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
